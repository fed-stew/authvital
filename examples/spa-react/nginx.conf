# Serve the static SPA bundle on :80 (the port the spa-react Traefik label
# targets in docker-compose.examples.yml). SPA history fallback ensures
# /auth/callback, /invite and /login are handled by the client-side router.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: any unknown path resolves to index.html so the
    # React router can render /auth/callback, /invite, /login, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
