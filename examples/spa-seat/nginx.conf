# Serve the Seat App bundle on :80 (matches the spa-seat Traefik label port in
# docker-compose.examples.yml). SPA history fallback for /auth/callback & /login.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
