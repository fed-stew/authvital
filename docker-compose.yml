# =============================================================================
# AuthVital - Docker Compose
# =============================================================================
#
# ACCESS URLS (when running locally):
#   - AuthVital App:       http://localhost:8080
#   - Admin Dashboard:     http://localhost:8080/admin
#   - API Health:          http://localhost:8080/api/health
#   - OAuth endpoints:     http://localhost:8080/oauth/authorize
#                          http://localhost:8080/oauth/token
#
# Quick Start:
#   1. Copy .env.example to .env and configure
#   2. docker compose up -d
#   3. Access at http://localhost:8080
#
# Lifecycle:
#   postgres (healthcheck) → migrate (runs once, exits) → api (starts)
#
# Postgres data lives in the NAMED VOLUME `authvital-pgdata` (declared at the
# bottom of this file), not a host bind mount. That makes resets idiomatic:
#   - `docker compose down`      -> stops containers, KEEPS the volume (data)
#   - `docker compose down -v`   -> stops containers AND removes the volume
#   - next `up` re-runs the idempotent bootstrap seed against a fresh DB
#
# Commands:
#   docker compose up -d              # Start all services
#   docker compose up -d --build      # Rebuild and start
#   docker compose logs -f api        # Follow API logs
#   docker compose logs migrate       # Check migration output
#   docker compose down               # Stop all services (data KEPT)
#
# Reset data (fresh start with new seed):
#   docker compose down -v            # drop the named volume
#   docker compose up -d              # reseeds a fresh DB
#
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: authvital-postgres
    ports:
      # Host-publish is a convenience for direct DB access; the app services
      # reach Postgres in-network on postgres:5432 regardless. If host :5432 is
      # already taken (another project's DB), override without editing compose:
      #   POSTGRES_PORT=5433 docker compose ... up   (or set it in .env)
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-authvital}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-authvital}
      POSTGRES_DB: ${DB_DATABASE:-authvital}
    volumes:
      # NAMED VOLUME (not a host bind mount). `down` keeps it; `down -v` wipes
      # it; next `up` reseeds fresh. Declared in the top-level `volumes:` below.
      - authvital-pgdata:/var/lib/postgresql/data
    networks:
      - authvital
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-authvital} -d ${DB_DATABASE:-authvital}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # Database Migrations (runs once, then exits)
  # ===========================================================================
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authvital-migrate
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./migrate.sh"]
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-authvital}:${DB_PASSWORD:-authvital}@postgres:5432/${DB_DATABASE:-authvital}
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-authvital}
      DB_PASSWORD: ${DB_PASSWORD:-authvital}
      DB_DATABASE: ${DB_DATABASE:-authvital}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@localhost}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-}
    volumes:
      - ./seed.config.yaml:/app/seed.config.yaml:ro
      - ./seed.config.example.yaml:/app/seed.config.example.yaml:ro
    networks:
      - authvital
    restart: "no"

  # ===========================================================================
  # AuthVital API (serves frontend, API, and OAuth)
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authvital-api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8000"
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USERNAME:-authvital}:${DB_PASSWORD:-authvital}@postgres:5432/${DB_DATABASE:-authvital}
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-authvital}
      DB_PASSWORD: ${DB_PASSWORD:-authvital}
      DB_DATABASE: ${DB_DATABASE:-authvital}

      # Application
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8000
      BASE_URL: ${BASE_URL:-http://localhost:8080}

      # Cookie security - default false for local HTTP development
      # Set to 'true' when using HTTPS in production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      # Master secret for key encryption - DO NOT USE DEFAULT IN PRODUCTION
      MASTER_SECRET: "${MASTER_SECRET:-}"

      # CORS - includes localhost:8080 for local docker-compose dev by default
      # Add additional origins as comma-separated list
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}

      # Email (used for password reset emails, etc.)
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-}

      # GCP Pub/Sub (optional - config managed via admin dashboard)
      PUBSUB_PROJECT_ID: ${PUBSUB_PROJECT_ID:-}
      PUBSUB_EMULATOR_HOST: ${PUBSUB_EMULATOR_HOST:-}
    volumes:
      - ./seed.config.yaml:/app/seed.config.yaml:ro
      - ./seed.config.example.yaml:/app/seed.config.example.yaml:ro
    networks:
      - authvital
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # ===========================================================================
  # SPLIT TOPOLOGY (opt-in via compose profile "split")
  # ===========================================================================
  # The default `api` service above (SERVICE_ROLE=all + legacy webhook
  # delivery) remains the simple single-container path — nothing to configure.
  #
  # The `split` profile demonstrates the hardened three-service topology:
  #
  #   authvital-public  (:8090)  SERVICE_ROLE=public  — data plane: OAuth/OIDC,
  #                              /auth/* login UI, member APIs. /admin/* → 404.
  #   authvital-admin   (:8091)  SERVICE_ROLE=admin   — control plane: /admin/*
  #                              dashboard + admin APIs + background crons.
  #                              /auth/* → 404. Put this behind a VPN/IAP.
  #   authvital-broker  (:8100)  webhook delivery engine (Postgres outbox
  #                              polling transport — no GCP needed).
  #
  # Both app services run WEBHOOK_DELIVERY_MODE=broker: the core only writes
  # events; the broker owns delivery/retries/failure tracking.
  #
  # Usage (the default `api` also starts unless you scale it away):
  #   docker compose --profile split up -d postgres migrate \
  #     authvital-public authvital-admin authvital-broker
  #
  # NOTE: BASE_URL must ALWAYS be the PUBLIC service URL — issuer, JWKS and
  # email links derive from it on both services. ADMIN_BASE_URL is only the
  # dashboard origin (CORS allow-list).
  # ===========================================================================
  authvital-public:
    profiles: ["split"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authvital-public
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8090:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-authvital}:${DB_PASSWORD:-authvital}@postgres:5432/${DB_DATABASE:-authvital}
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-authvital}
      DB_PASSWORD: ${DB_PASSWORD:-authvital}
      DB_DATABASE: ${DB_DATABASE:-authvital}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8000
      SERVICE_ROLE: public
      WEBHOOK_DELIVERY_MODE: broker
      BASE_URL: ${BASE_URL:-http://localhost:8090}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL:-http://localhost:8091}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MASTER_SECRET: "${MASTER_SECRET:-}"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8090,http://localhost:8091}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-}
    networks:
      - authvital
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  authvital-admin:
    profiles: ["split"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authvital-admin
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # In production DO NOT publish this publicly — VPN/IAP/internal LB only.
      - "8091:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-authvital}:${DB_PASSWORD:-authvital}@postgres:5432/${DB_DATABASE:-authvital}
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-authvital}
      DB_PASSWORD: ${DB_PASSWORD:-authvital}
      DB_DATABASE: ${DB_DATABASE:-authvital}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8000
      SERVICE_ROLE: admin
      WEBHOOK_DELIVERY_MODE: broker
      # BASE_URL stays the PUBLIC origin even on the admin service (issuer,
      # JWKS, email links) — see src/config/service-role.ts
      BASE_URL: ${BASE_URL:-http://localhost:8090}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL:-http://localhost:8091}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MASTER_SECRET: "${MASTER_SECRET:-}"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8090,http://localhost:8091}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-}
      PUBSUB_PROJECT_ID: ${PUBSUB_PROJECT_ID:-}
      PUBSUB_EMULATOR_HOST: ${PUBSUB_EMULATOR_HOST:-}
    networks:
      - authvital
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  authvital-broker:
    profiles: ["split"]
    build:
      context: .
      dockerfile: packages/broker/Dockerfile
    container_name: authvital-broker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8100:8100"
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-authvital}:${DB_PASSWORD:-authvital}@postgres:5432/${DB_DATABASE:-authvital}
      NODE_ENV: ${NODE_ENV:-production}
      BROKER_PORT: 8100
      BROKER_TRANSPORT: outbox # Postgres polling — no GCP required
      # Same secret as the app services — decrypts the webhook signing key
      MASTER_SECRET: "${MASTER_SECRET:-}"
    networks:
      - authvital
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

networks:
  authvital:
    name: authvital
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
# Postgres data. Explicitly named so it's predictable regardless of the compose
# project name. Clean reset is `docker compose down -v` (see header).
volumes:
  authvital-pgdata:
    name: authvital-pgdata
